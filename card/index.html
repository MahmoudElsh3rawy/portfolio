    <script>
      // Pick the language before first paint so the page never flashes in the
      // wrong direction: ?lang= > saved choice > device language.
      ;(function () {
        var lang
        try {
          lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('card-lang')
        } catch (e) {}
        if (lang !== 'ar' && lang !== 'en') {
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']
          lang = /^ar\b/i.test(langs[0]) ? 'ar' : 'en'
        }
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
